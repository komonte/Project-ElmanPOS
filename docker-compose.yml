services:
  db:
    image: postgres:16-alpine
    container_name: elman_u_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Only this PC reaches Postgres: everything else goes through the app.
    # Docker bypasses the host firewall (ufw), so the bind address is the
    # only lock. Never publish it as "5432:5432" (open to the whole LAN).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
